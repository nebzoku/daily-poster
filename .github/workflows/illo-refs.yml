name: Illustration references

# Photographic references for the illustrated posters (scripts/illo-refs.mjs), saved under
# experiments/claude-posters/refs/<date>/, not on the site. Runs after the morning brief, by hand, or when
# requests/illo-refs.txt (search terms, one per line) or the script changes.
on:
  schedule:
    - cron: "47 5 * * *"
    - cron: "23 6 * * *"
  push:
    branches: [main]
    paths: [requests/illo-refs.txt, scripts/illo-refs.mjs]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: illo-refs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch the references
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          d=$(node -e "console.log(JSON.parse(require('fs').readFileSync('site/data/latest.json','utf8')).date)")
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "experiments/claude-posters/refs/$d/refs.json" ]; then echo "Already have today's."; exit 0; fi
          node scripts/illo-refs.mjs
      - name: Save them
        run: |
          git config user.name "daily-poster-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/claude-posters/refs
          git diff --cached --quiet && exit 0
          git commit -m "Illustration references for $(node -e "console.log(JSON.parse(require('fs').readFileSync('site/data/latest.json','utf8')).date)")"
          for i in 1 2 3 4; do git pull --rebase -q && git push && exit 0; sleep $((i * 15)); done
