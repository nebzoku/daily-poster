<!doctype html><html><head><style>
@font-face{font-family:IS;src:url(file:///tmp/fonts/node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2)}
@font-face{font-family:IT;src:url(file:///tmp/fonts/node_modules/@fontsource/inter-tight/files/inter-tight-latin-500-normal.woff2)}
@font-face{font-family:GM;src:url(file:///tmp/fonts/node_modules/@fontsource/geist-mono/files/geist-mono-latin-400-normal.woff2)}
html,body{margin:0;width:2160px;height:3056px;background:#FFD9E6;overflow:hidden;position:relative}
.lab{position:absolute;top:48px;font:400 34px/1 GM;letter-spacing:.04em;text-transform:uppercase;color:#370E21}
canvas,img{position:absolute;display:block}

</style></head><body>
<div class="lab" style="left:60px">Daily Poster</div>
<div class="lab" style="right:60px">No. 033 · Wed 4 Nov · The Guardian</div>
<script>
const W = 2160, H = 3056, M = 60, DARK = "#370E21", MID = "#7C6D72";
// Draw text into its own canvas, rotated about its centre, cropped to the actual ink.
function ink(text, size, colour, rot = 0, track = 0) {
  const pad = size * 1.2, c = document.createElement("canvas");
  const x = c.getContext("2d"); x.font = `400 ${size}px IS`; if (track) x.letterSpacing = track + "px";
  const w = x.measureText(text).width; c.width = Math.ceil(w + pad * 2); c.height = Math.ceil(size * 2 + pad * 2);
  const g = c.getContext("2d"); g.font = `400 ${size}px IS`; if (track) g.letterSpacing = track + "px"; g.fillStyle = colour;
  g.translate(c.width / 2, c.height / 2); g.rotate(rot * Math.PI / 180); g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(text, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height).data; let l = c.width, t = c.height, r = 0, b = 0;
  for (let yy = 0; yy < c.height; yy++) for (let xx = 0; xx < c.width; xx++) if (d[(yy * c.width + xx) * 4 + 3] > 40) { if (xx < l) l = xx; if (xx > r) r = xx; if (yy < t) t = yy; if (yy > b) b = yy; }
  const o = document.createElement("canvas"); o.width = r - l + 1; o.height = b - t + 1; o.getContext("2d").drawImage(c, -l, -t);
  return o;
}
const put = (cv, { left, right, top, bottom }) => { if (left != null) cv.style.left = left + "px"; if (right != null) cv.style.left = (W - right - cv.width) + "px";
  if (top != null) cv.style.top = top + "px"; if (bottom != null) cv.style.top = (H - bottom - cv.height) + "px"; document.body.append(cv); return cv; };
// Size text so its ink spans exactly `w` pixels.
function fit(text, w, colour, track) { let s = 400; let c = ink(text, s, colour, 0, track * s); s = s * w / c.width; return ink(text, s, colour, 0, track * s); }
document.fonts.ready.then(() => {
  // ness: the full width, sitting on the bottom margin.
  const ness = put(fit("ness", W - 2 * M, DARK, -0.03), { left: M, bottom: M });
  // less: flush right, just lifting.
  const lessSize = ness.height / 0.43 * 0.62;   // a step smaller than ness
  const lessTop = H - M - ness.height - 70;
  const parts = "less".split(""), lift = [0, 14, 34, 60], rot = [0, 2, -3, 5];
  let x = W - M; const made = parts.map((ch, i) => ink(ch, lessSize, DARK, rot[i])).reverse();
  made.forEach((cv, j) => { const i = 3 - j; x -= cv.width; put(cv, { left: x, top: lessTop - cv.height - lift[i] }); x -= lessSize * 0.035; });
  // Weight: flush left, letters drifting up and turning more as they go.
  const wSize = lessSize * 0.6, base = lessTop - lessSize * 0.62 - 110;
  const wl = "Weight".split(""), wr = [-4, 8, -14, 18, -26, 34], wy = [0, 30, 90, 170, 270, 390];
  let wx = M; wl.forEach((ch, i) => { const cv = ink(ch, wSize, MID, wr[i]); put(cv, { left: wx, top: base - cv.height - wy[i] }); wx += cv.width + wSize * (0.04 + i * 0.03); });
  // Medicine / grown in: the start of the headline, cascading left then right, same face.
  const med = put(fit("Medicine", 1240, DARK, -0.01), { left: M, top: 210 });
  const grown = put(fit("grown in", 1040, DARK, -0.01), { right: M, top: 210 + med.height + 40 });
  // Subline, secondary, under "grown in" on the right.
  const sub = document.createElement("div"); sub.className = "sub"; sub.textContent = "Three washing-machine-sized capsules orbit 300 miles up, and pharma firms are using them to grow drug crystals.";
  sub.style.left = M + "px"; sub.style.top = (210 + med.height + 40 + grown.height + 70) + "px"; document.body.append(sub);
  const cap = document.createElement("img"); cap.src = "file:///home/claude/daily-poster/site/media/2026-11-04/object-1.png";
  Object.assign(cap.style, { width: "360px", left: "860px", top: (210 + med.height + 40 + grown.height + 10) + "px", transform: "rotate(-24deg)" }); document.body.append(cap);
  cap.onload = () => document.body.dataset.ready = 1; if (cap.complete) document.body.dataset.ready = 1;
});
</script></body></html>
