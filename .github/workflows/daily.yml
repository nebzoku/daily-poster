name: Daily brief

on:
  schedule:
    # 05:30 UTC: 05:30 in London in winter, 06:30 in summer.
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Remake today's brief even if it already exists"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Write today's brief
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: npm run generate

      # Small copies of museum and texture images, so "Copy for Figma" can always use them.
      - name: Copy images to the site
        run: npm run media

      - name: Save it to the repo
        run: |
          git config user.name "daily-poster-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/media
          git diff --cached --quiet || git commit -m "Brief and images for $(TZ=Europe/London date +%F)"
          git pull --rebase -q && git push

      # The link preview takes the day's colour.
      - name: Preview image for today
        run: |
          colour=$(node -p "require('./site/data/latest.json').colour.name.toLowerCase()")
          cp "site/og/$colour.png" site/og.png && echo "Preview: $colour"

      # Stamp the asset links with this commit, so browsers fetch the new code after a deploy.
      - name: Version the assets
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
