<!doctype html><html><head><style>
@font-face{font-family:IS;src:url(file:///tmp/fonts/node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2)}
@font-face{font-family:IT;src:url(file:///tmp/fonts/node_modules/@fontsource/inter-tight/files/inter-tight-latin-500-normal.woff2)}
@font-face{font-family:GM;src:url(file:///tmp/fonts/node_modules/@fontsource/geist-mono/files/geist-mono-latin-400-normal.woff2)}
html,body{margin:0;width:2160px;height:3056px;background:#370E21;overflow:hidden;color:#FFD9E6}
.lab{position:absolute;font:400 36px/1 GM;letter-spacing:.04em;text-transform:uppercase;color:#FFD9E6}
.l{position:absolute;font:400 1000px/1 IS;color:#F33496;transform-origin:50% 55%;white-space:nowrap}
.pre{position:absolute;left:96px;top:250px;font:500 72px/1.05 IT;letter-spacing:-.015em;color:#FFD9E6}
.sub{position:absolute;left:96px;top:450px;width:640px;font:500 38px/1.3 IT;color:#FFD9E6;opacity:.7}
img{position:absolute}
#ground{position:absolute;left:0;right:0;font:400 1180px/1 IS;letter-spacing:-.035em;color:#F33496;text-align:center;white-space:nowrap}
</style></head><body>
<div class="lab" style="left:48px;top:48px">Daily Poster</div>
<div class="lab" style="right:48px;top:48px">Wed 4 Nov</div>
<div class="lab" style="left:48px;bottom:48px">No. 033</div>
<div class="lab" style="right:48px;bottom:48px">The Guardian</div>
<div class="pre">Medicine<br>grown in</div>
<div class="sub">Three washing-machine-sized capsules orbit 300 miles up, and pharma firms are using them to grow drug crystals.</div>
<img src="file:///home/claude/daily-poster/site/media/2026-11-04/object-1.png" style="left:1500px;top:90px;width:560px;transform:rotate(-20deg)">
<div id="ground">ness</div>
<div id="w"></div>
<script>
document.fonts.ready.then(() => {
  // "ness" sits on the ground, its baseline on the bottom margin.
  const g = document.getElementById("ground"), fs = 1180;
  const c = document.createElement("canvas").getContext("2d"); c.font = `400 ${fs}px IS`;
  const m = c.measureText("ness"); const asc = m.fontBoundingBoxAscent, base = 2930;
  g.style.top = (base - asc) + "px";
  // "less" just leaving the ground, "Weight" adrift: [letter, x, baseline, rotation, size, colour]
  const L = [
    ["l", 130, 2110, -2, 900, "#F33496"], ["e", 400, 2060, 4, 900, "#F33496"], ["s", 860, 2010, -7, 900, "#F33496"], ["s", 1300, 1950, 10, 900, "#F33496"],
    ["W", 90, 1330, -8, 600, "#FFD9E6"], ["e", 650, 1350, 12, 560, "#FFD9E6"], ["i", 930, 1270, -18, 560, "#FFD9E6"],
    ["g", 1180, 1230, 24, 560, "#FFD9E6"], ["h", 1500, 1060, -30, 520, "#FFD9E6"], ["t", 1790, 880, 42, 480, "#FFD9E6"]];
  const W = document.getElementById("w");
  for (const [ch, x, b, r, s, col] of L) { c.font = `400 ${s}px IS`; const a = c.measureText(ch).fontBoundingBoxAscent;
    const e = document.createElement("div"); e.className = "l"; e.textContent = ch;
    Object.assign(e.style, { left: x+"px", top: (b - a)+"px", fontSize: s+"px", color: col, transform: `rotate(${r}deg)` }); W.append(e); }
  document.body.dataset.ready = 1; });
</script>
</body></html>
