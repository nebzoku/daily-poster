name: Daily brief

on:
  schedule:
    # About 05:15 UTC (05:15 in London in winter, 06:15 in summer), with two later
    # tries in case GitHub runs late or skips one, as it can at busy times. Making the
    # brief is skipped once today's exists, so the later tries cost nothing.
    # Odd minutes, because GitHub is busiest on the hour and half hour.
    - cron: "13 5 * * *"
    - cron: "47 6 * * *"
    - cron: "21 8 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Remake today's brief even if it already exists"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/**", "instagram/kick"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs on every trigger, pushes included: it does nothing once today's brief exists,
      # and it means any push can catch up a missed morning.
      - name: Write today's brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: npm run generate

      # Three 3D objects for the brief, rendered in Blender (the bpy package). Skipped when
      # today's are already done, so it only renders once a day.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Render the 3D objects
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POLY_PIZZA_KEY: ${{ secrets.POLY_PIZZA_KEY }}
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: |
          if node -e "process.exit(require('./site/data/latest.json').objects?.length && !process.env.FORCE ? 0 : 1)"; then
            echo "Today's objects are already rendered."
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1 >/dev/null
            pip install -q -r scripts/blender/requirements.txt
            BLENDER_PYTHON=python npm run objects || echo "::warning::The 3D objects didn't render today."
          fi

      # Small copies of museum and texture images, so "Copy for Figma" can always use them.
      - name: Copy images to the site
        run: npm run media

      # Pictures for the Instagram account (scripts/instagram): today's brief carousel and a 4:5
      # mockup of each poster waiting to go out. Skipped until Instagram is set up.
      - name: Instagram pictures
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: |
          n=$(node scripts/instagram/images.mjs --list)
          if [ "$n" != "0" ]; then
            npx playwright install --with-deps chromium >/dev/null
            node scripts/instagram/images.mjs || echo "::warning::The Instagram pictures didn't render."
          fi

      - name: Save it to the repo
        run: |
          git config user.name "daily-poster-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/media
          [ -d instagram ] && git add instagram
          git diff --cached --quiet || git commit -m "Brief and images for $(TZ=Europe/London date +%F)"
          # GitHub sometimes rejects a push with a server error; try a few times. If it still
          # fails, carry on: the site is deployed from these files either way.
          for i in 1 2 3 4; do
            git pull --rebase -q && git push && exit 0
            sleep $((i * 15))
          done
          echo "::warning::Couldn't save today's files to the repo; the site still deploys."

      # The link preview and the favicon take the day's colour.
      - name: Preview image for today
        run: |
          colour=$(node -p "require('./site/data/latest.json').colour.name.toLowerCase()")
          cp "site/og/$colour.png" site/og.png && echo "Preview: $colour"
          cp "site/favicon/$colour-icon.png" site/favicon.png
          cp "site/favicon/$colour-apple.png" site/apple-touch-icon.png

      # Stamp the asset links with this commit, so browsers fetch the new code after a deploy.
      - name: Version the assets
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
